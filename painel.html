<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ranking de Carteiras — Fundo da Família</title>

  <style>
    :root{
      --bg:#000000; --card:#0a0a0a; --grid:#0f0f0f;
      --text:#c7f9cc; --text-dim:#6ee7b7; --neon:#39ff14;
      --neon-soft: rgba(57,255,20,0.15); --danger:#ff6b6b; --muted:#2a2a2a;
    }
    *{box-sizing:border-box; font-family:system-ui,Segoe UI,Roboto,Arial;}
    body{margin:0;background:var(--bg);color:var(--text);}
    .container{max-width:1200px;margin:auto;padding:20px;}
    h1{color:var(--neon);text-shadow:0 0 12px var(--neon-soft);}
    .muted{color:var(--text-dim);font-size:13px;margin-bottom:10px;}
    table{width:100%;border-collapse:collapse;margin-top:10px;}
    th,td{padding:8px;border-bottom:1px solid #113a19;font-size:13px;}
    th{text-transform:uppercase;font-size:11px;color:var(--text-dim);}
    tr:hover td{background:rgba(57,255,20,0.03);}
    .rank{color:var(--neon);font-weight:bold;}
    .right{text-align:right;}
    .center{text-align:center;}
    .footer{font-size:12px;color:#7ee2b8;margin-top:10px;opacity:0.7;}
    
    /* Chips e controles */
    .chip{display:inline-flex;align-items:center;gap:6px;background:#0f172a;border:1px solid #1e293b;border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;transition:all 0.2s;}
    .chip-pos{background:#065f46;border-color:#047857;color:#d1fae5;}
    .chip:hover{opacity:0.8;}
    .controls{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap;}
    .small{font-size:12px;color:#9ca3af;}
  </style>
</head>

<body>
<div class="container">
  <h1>🏆 Ranking de Carteiras — Fundo Familiar</h1>
  <div class="muted">Atualização a cada 5 segundos • Lucro 50% ao vivo • Privacidade total</div>

  <!-- Botão de Saque Dia 7 -->
  <div class="controls">
    <button id="btnSaqueDia7" class="chip chip-pos" style="cursor:pointer">💸 Solicitar Saque (dia 7)</button>
  </div>

  <table>
    <thead>
      <tr>
        <th class="center">#</th>
        <th>Carteira</th>
        <th class="right">Saldo (BRL)</th>
        <th class="right">Saldo (BTC)</th>
        <th class="right">Lucro 50% (BRL)</th>
        <th class="right">Lucro (%)</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div class="footer">Fonte: /fund/state e /fund/summary</div>
</div>

<!-- Modal de Saque -->
<div id="modalSaque" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); align-items:center; justify-content:center; z-index:9999">
  <div style="width:min(420px,94vw); background:#0b1220; border:1px solid #1f2937; border-radius:14px; padding:14px">
    <h3 style="margin:0 0 8px">Saque do Lucro (apenas dia 7)</h3>
    <p class="small" id="dia7Info"></p>
    <div style="display:grid; gap:8px; margin-top:8px">
      <input id="wdAddress" placeholder="Endereço BTC (bc1...)" style="background:#020617;border:1px solid #374151;border-radius:8px;padding:8px;color:#e5e7eb">
      <input id="wdKeyword" placeholder="Palavra-chave" type="password" style="background:#020617;border:1px solid #374151;border-radius:8px;padding:8px;color:#e5e7eb">
      <input id="wdAmountBRL" type="number" step="0.01" placeholder="Valor (BRL) — opcional" style="background:#020617;border:1px solid #374151;border-radius:8px;padding:8px;color:#e5e7eb">
      <button id="wdSubmit" class="chip chip-pos" style="justify-content:center">Enviar pedido</button>
      <button id="wdClose" class="chip" style="justify-content:center">Fechar</button>
      <div id="wdMsg" class="small"></div>
    </div>
  </div>
</div>

<script>
// TROQUE PELO SEU TRY-CLOUDFLARE QUANDO FOR PARA A FAMÍLIA:
const BACKEND = "https://attribute-hierarchy-restoration-und.trycloudflare.com";

let wallets = [];
let btcBRL = 0;

//---------------------------------------------
// BUSCA COTAÇÃO
//---------------------------------------------
async function getPrice() {
  try {
    const r = await fetch(`${BACKEND}/fund/summary`);
    const j = await r.json();
    if (j.rates?.btcusdt && j.rates?.usdtbrl) {
      btcBRL = j.rates.btcusdt * j.rates.usdtbrl;
    }
  } catch(e){ console.log("Erro cotação", e); }
}

//---------------------------------------------
// BUSCA CARTEIRAS + CÁLCULOS
//---------------------------------------------
async function getWallets() {
  try {
    const r = await fetch(`${BACKEND}/fund/state`);
    const j = await r.json();

    if (!j.ok) return [];

    return j.participants
      .filter(p => p.btcAddress)
      .map(p => {
        const invest = Number(p.totalContributed || 0);
        const lucroTotal = Number(p.accruedProfit || 0);

        // LÓGICA DO ADM — divisão do lucro
        const lucro50 = lucroTotal * 0.50;
        const saldoFinal = invest + lucro50;

        const lucroPercent =
          invest > 0 ? (lucro50 / invest) * 100 : 0;

        return {
          address: p.btcAddress,
          invest,
          lucro50,
          lucroPercent,
          saldoBRL: saldoFinal,
          saldoBTC: btcBRL ? saldoFinal / btcBRL : 0
        };
      });

  } catch(e){ console.log("Erro fund/state", e); return []; }
}

//---------------------------------------------
// FORMATADORES
//---------------------------------------------
function fmtBRL(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function fmtBTC(v){return v.toFixed(6);}
function fmtPct(v){return v.toFixed(2)+"%";}
function shortAddr(a){return a.slice(0,6)+"…"+a.slice(-6);}

//---------------------------------------------
// DESENHA TABELA
//---------------------------------------------
function render() {
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  const sorted = [...wallets].sort((a,b)=> b.saldoBRL - a.saldoBRL);

  sorted.forEach((w,i)=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="center rank">${i+1}</td>
      <td>${shortAddr(w.address)}</td>
      <td class="right">${fmtBRL(w.saldoBRL)}</td>
      <td class="right">${fmtBTC(w.saldoBTC)} BTC</td>
      <td class="right">${fmtBRL(w.lucro50)}</td>
      <td class="right">${fmtPct(w.lucroPercent)}</td>
    `;
    tbody.appendChild(tr);
  });
}

//---------------------------------------------
// CICLO PRINCIPAL
//---------------------------------------------
async function update() {
  await getPrice();
  wallets = await getWallets();
  render();
}

// ---- Boleta dia 7 (painel.html) ----
function isDia7Now(){
  // America/Sao_Paulo
  const now = new Date();
  const dia = new Intl.DateTimeFormat('pt-BR',{ timeZone:'America/Sao_Paulo', day:'2-digit'}).format(now);
  return Number(dia) === 7;
}

function openModalSaque(){
  const modal = document.getElementById('modalSaque');
  const info  = document.getElementById('dia7Info');
  const ok = isDia7Now();
  info.textContent = ok
    ? 'Saque liberado: hoje é dia 7. Se o lucro convertido for menor que 0.0001 BTC, o sistema reinveste automaticamente.'
    : 'Bloqueado: o saque só é permitido no dia 7 (horário de São Paulo).';
  document.getElementById('wdSubmit').disabled = !ok;
  modal.style.display = 'flex';
}

document.getElementById('btnSaqueDia7').onclick = openModalSaque;
document.getElementById('wdClose').onclick = ()=> (document.getElementById('modalSaque').style.display='none');

async function postJSON(url, body){
  const r = await fetch(url,{ method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if (!r.ok) throw new Error('Falha de rede');
  return r.json();
}

document.getElementById('wdSubmit').onclick = async ()=>{
  const msg = document.getElementById('wdMsg');
  msg.textContent = 'Enviando...';
  try{
    const payload = {
      address: (document.getElementById('wdAddress').value||'').trim(),
      keyword: (document.getElementById('wdKeyword').value||'').trim(),
      amountBRL: Number(document.getElementById('wdAmountBRL').value||0) || null
    };
    const out = await postJSON(`${BACKEND}/fund/withdraw-request`, payload);
    msg.textContent = out.ok ? `✅ Pedido #${out.id} criado. Status: ${out.status}` : (out.error||'Erro');
  }catch(e){
    msg.textContent = 'Erro ao enviar pedido.';
  }
};

setInterval(update, 5000);
update();
</script>

</body>
</html>
